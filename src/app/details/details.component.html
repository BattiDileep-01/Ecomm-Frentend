
<div class="details-section">
    <div class="container-fluid">

        <hr>
        <br>
        <br>
        <br>
        <img src="{{product.imageUrl}}" class="detail-img" >

        <h4>Description</h4>

        <a routerLink="/product"> Back to product </a>
